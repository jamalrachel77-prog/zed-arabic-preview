name: Build Zed Arabic Preview (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Zed Arabic preview
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout preview recipe
        uses: actions/checkout@v4

      - name: Checkout official Zed source
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: e21ff1b368b074586e4dae0d9bbf15d5dd8a1476
          path: zed

      - name: Decode and apply Arabic patch
        shell: pwsh
        run: |
          $encoded = (Get-Content "patches/zed-arabic.patch.gz.b64" -Raw).Trim()
          $compressed = [Convert]::FromBase64String($encoded)
          $inputStream = [System.IO.MemoryStream]::new($compressed)
          $gzip = [System.IO.Compression.GZipStream]::new($inputStream, [System.IO.Compression.CompressionMode]::Decompress)
          $outputStream = [System.IO.MemoryStream]::new()
          $gzip.CopyTo($outputStream)
          [System.IO.File]::WriteAllBytes("$PWD/zed-arabic.patch", $outputStream.ToArray())
          git -C zed apply --check ../zed-arabic.patch
          git -C zed apply ../zed-arabic.patch

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Windows Rust target
        shell: pwsh
        run: rustup target add x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zed -> zed/target

      - name: Build Zed executable
        shell: pwsh
        working-directory: zed
        env:
          CARGO_INCREMENTAL: 0
        run: cargo build --release --package zed --target x86_64-pc-windows-msvc

      - name: Upload preview executable
        uses: actions/upload-artifact@v4
        with:
          name: zed-arabic-preview-x64
          path: zed/target/x86_64-pc-windows-msvc/release/zed.exe
          if-no-files-found: error
          retention-days: 14
