name: Build Zed Arabic Preview (Windows x64)

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: zed-arabic-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-x64:
    name: Build Zed Arabic installer
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout preview recipe
        uses: actions/checkout@v4

      - name: Checkout official Zed source
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: e21ff1b368b074586e4dae0d9bbf15d5dd8a1476
          path: zed

      - name: Decode and apply Arabic source patch
        shell: pwsh
        run: |
          $encoded = (Get-Content "patches/zed-arabic.patch.gz.b64" -Raw).Trim()
          $compressed = [Convert]::FromBase64String($encoded)
          $inputStream = [System.IO.MemoryStream]::new($compressed)
          $gzip = [System.IO.Compression.GZipStream]::new($inputStream, [System.IO.Compression.CompressionMode]::Decompress)
          $outputStream = [System.IO.MemoryStream]::new()
          $gzip.CopyTo($outputStream)
          [System.IO.File]::WriteAllBytes("$PWD/zed-arabic.patch", $outputStream.ToArray())
          git -C zed apply --check ../zed-arabic.patch
          git -C zed apply ../zed-arabic.patch

          # Keep the VS Code settings importer compatible with the added UI language setting.
          $importPath = "zed/crates/settings/src/vscode_import.rs"
          $importSource = Get-Content $importPath -Raw
          $themeInitializer = '            theme: Box::new(self.theme_settings_content()),'
          if (-not $importSource.Contains($themeInitializer)) { throw "Expected SettingsContent theme initializer was not found in vscode_import.rs" }
          if (-not $importSource.Contains("ui_language:")) {
            $importSource = $importSource.Replace($themeInitializer, $themeInitializer + "`n            ui_language: None,")
            Set-Content -Path $importPath -Value $importSource -Encoding utf8
          }

      - name: Fix Visual Studio discovery for GitHub runner
        shell: pwsh
        run: |
          $scriptPath = "zed/script/bundle-windows.ps1"
          $source = Get-Content $scriptPath -Raw
          $oldLine = '& "C:\Program Files\Microsoft Visual Studio\2022\Community\Common7\Tools\Launch-VsDevShell.ps1" -Arch (Get-VSArch -Arch $Architecture) -HostArch (Get-VSArch -Arch $OSArchitecture)'
          $newLine = '$vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"' + "`n" +
            'if (-not (Test-Path $vswhere)) { throw "Visual Studio Installer vswhere.exe was not found" }' + "`n" +
            '$vsInstall = & $vswhere -latest -products * -property installationPath' + "`n" +
            'if (-not $vsInstall) { throw "Visual Studio 2022 installation was not found" }' + "`n" +
            '$vsDevShell = Join-Path $vsInstall "Common7\Tools\Launch-VsDevShell.ps1"' + "`n" +
            'if (-not (Test-Path $vsDevShell)) { throw "Launch-VsDevShell.ps1 was not found at $vsDevShell" }' + "`n" +
            '& $vsDevShell -Arch (Get-VSArch -Arch $Architecture) -HostArch (Get-VSArch -Arch $OSArchitecture)'
          if (-not $source.Contains($oldLine)) { throw "Expected Visual Studio launch line was not found in bundle-windows.ps1" }
          $source = $source.Replace($oldLine, $newLine)
          Set-Content -Path $scriptPath -Value $source -Encoding utf8

      - name: Build official Windows installer
        shell: pwsh
        working-directory: zed
        env:
          CARGO_INCREMENTAL: 0
        run: ./script/bundle-windows.ps1 -Architecture x86_64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: zed-arabic-preview-windows-x64-installer
          path: zed/target/Zed-x86_64.exe
          if-no-files-found: error
          retention-days: 14
